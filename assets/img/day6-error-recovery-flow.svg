<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph 错误处理与检查点恢复流程</title>
  <desc id="desc">从图运行到并行节点失败，再经过检查点定位、修复和恢复的流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="60" y="54" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#172033">CP3-04 → CP3-06：失败不是状态丢失</text>
  <text x="60" y="86" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">检查点保存已完成任务与失败现场，后续可以从未完成的位置继续推进。</text>
  <g filter="url(#shadow)">
    <rect x="60" y="145" width="210" height="110" rx="14" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
    <text x="165" y="181" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">CP3-04</text>
    <text x="165" y="213" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" fill="#334155">正常图运行</text>
    <text x="165" y="238" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">topic 已写入 State</text>
  </g>
  <path d="M270 200 H350" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="350" y="125" width="250" height="150" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="475" y="163" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#9a3412">并行超步</text>
    <text x="475" y="198" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" fill="#334155">node_poem ✓</text>
    <text x="475" y="226" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" fill="#b91c1c">node_joke ✕ RuntimeError</text>
    <text x="475" y="252" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">node_output 暂不执行</text>
  </g>
  <path d="M600 200 H680" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="680" y="125" width="210" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="785" y="163" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Postgres</text>
    <text x="785" y="197" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" fill="#334155">StateSnapshot</text>
    <text x="785" y="224" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">values / next / tasks</text>
    <text x="785" y="249" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">error 已留存</text>
  </g>
  <path d="M890 200 H970" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="970" y="125" width="170" height="150" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="1055" y="163" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#065f46">CP3-05</text>
    <text x="1055" y="198" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" fill="#334155">读取 tasks</text>
    <text x="1055" y="225" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">定位失败节点</text>
    <text x="1055" y="250" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">get_state_history</text>
  </g>
  <path d="M785 275 V355 H475 V390" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="350" y="390" width="250" height="90" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="475" y="427" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#166534">CP3-06</text>
    <text x="475" y="456" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">修复故障 → invoke(None) 续跑</text>
  </g>
  <path d="M600 435 H680" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="680" y="390" width="210" height="90" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="785" y="427" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#5b21b6">继续执行</text>
    <text x="785" y="456" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">joke → output → END</text>
  </g>
  <text x="60" y="510" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">注：已完成节点可能复用 cached write；失败且没有结果的节点才会重新执行。</text>
</svg>
